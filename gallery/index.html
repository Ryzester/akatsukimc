<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>ギャラリー | 暁鯖</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<!-- ==============================
     ヘッダー
============================== -->

<header class="site-header">

    <div class="container nav">

        <!-- ロゴ -->

        <a class="brand" href="/">

            <img
                src="/assets/akatsuki-icon.png"
                alt="暁鯖">

            <span>
                暁鯖
                <small>AKATSUKI SABA</small>
            </span>

        </a>


        <!-- ナビゲーション -->

        <nav class="navlinks">

            <a href="/">
                ホーム
            </a>

            <a href="/news/">
                ニュース
            </a>

            <a href="/pvp/">
                PvP
            </a>

            <a href="/rules/">
                ルール
            </a>

            <a class="active" href="/gallery/">
                ギャラリー
            </a>

            <a href="/shop/">
                ストア
            </a>

        </nav>

    </div>

</header>


<main>

    <!-- ==============================
         ギャラリーページタイトル
    ============================== -->

    <section class="page-hero">

        <div class="container reveal">

            <small>
                GALLERY
            </small>

            <h1>
                ギャラリー
            </h1>

            <p>
                AI画像ではなく、
                実際の暁鯖スクリーンショットを掲載します。
            </p>

        </div>

    </section>


    <!-- ==============================
         ギャラリー
    ============================== -->

    <section class="section">

        <div class="container">

            <div class="gallery-grid reveal">


                <!-- ==============================
                     メインロビー
                ============================== -->

                <div class="photo-slot large">

                    <img
                        src="/assets/gallery-1.jpg"
                        alt="メインロビー"
                        onerror="this.style.display='none'">

                    <div class="photo-fallback">

                        <b>
                            メインロビー
                        </b>

                        <span>
                            assets/gallery-1.jpg
                        </span>

                    </div>

                </div>


                <!-- ==============================
                    FFA
                ============================== -->

                <div class="photo-slot">

                    <img
                        src="/assets/gallery-2.jpg"
                        alt="FFA"
                        onerror="this.style.display='none'">

                    <div class="photo-fallback">

                        <b>
                            FFA
                        </b>

                        <span>
                            assets/gallery-2.jpg
                        </span>

                    </div>

                </div>


                <!-- ==============================
                     待機場
                ============================== -->

                <div class="photo-slot">

                    <img
                        src="/assets/gallery-3.jpg"
                        alt="待機場"
                        onerror="this.style.display='none'">

                    <div class="photo-fallback">

                        <b>
                            待機場
                        </b>

                        <span>
                            assets/gallery-3.jpg
                        </span>

                    </div>

                </div>


                <!-- ==============================
                     ロビー2
                ============================== -->

                <div class="photo-slot">

                    <img
                        src="/assets/gallery-4.jpg"
                        alt="暁鯖 Event"
                        onerror="this.style.display='none'">

                    <div class="photo-fallback">

                        <b>
                            ロビー
                        </b>

                        <span>
                            assets/gallery-4.jpg
                        </span>

                    </div>

                </div>


                <!-- ==============================
                     Players
                ============================== -->

                <div class="photo-slot">

                    <img
                        src="/assets/gallery-5.jpg"
                        alt="暁鯖 Players"
                        onerror="this.style.display='none'">

                    <div class="photo-fallback">

                        <b>
                            
                        </b>

                        <span>
                            
                        </span>

                    </div>

                </div>


            </div>

        </div>

    </section>

</main>


<!-- ==============================
     フッター
============================== -->

<footer>

    <div class="container footer">

        <div>
            © 2026 暁鯖 - AKATSUKI SABA
        </div>

        <div class="footer-links">

            <a href="/rules/">
                ルール
            </a>

            <a href="/legal/">
                特定商取引法に基づく表記
            </a>

            <a href="/privacy/">
                プライバシーポリシー
            </a>

        </div>

    </div>

</footer>


<!-- ==============================
     JavaScript
============================== -->

<script src="/script.js"></script>

</body>

</html>
